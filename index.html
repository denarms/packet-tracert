<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cisco Packet Tracer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/common/app.png">
</head>
<body>

  <!-- Full Window Container -->
  <div class="pt-app-window">

    <!-- Top Windows OS Title Bar -->
    <div class="pt-title-bar">
      <div class="pt-title-content">
        <img src="assets/common/app.png" alt="Packet Tracer" class="pt-title-icon">
        <span class="pt-title-text">Cisco Packet Tracer</span>
      </div>
      <div class="pt-window-controls">
        <button class="pt-win-btn" title="Minimizar">&#8212;</button>
        <button class="pt-win-btn" title="Maximizar">&#9633;</button>
        <button class="pt-win-btn pt-win-close" title="Cerrar">&#10005;</button>
      </div>
    </div>

    <!-- Classic Menu Bar -->
    <nav class="pt-menu-bar">
      <div class="menu-item"><span><u>F</u>ile</span></div>
      <div class="menu-item"><span><u>E</u>dit</span></div>
      <div class="menu-item"><span><u>O</u>ptions</span></div>
      <div class="menu-item"><span><u>V</u>iew</span></div>
      <div class="menu-item"><span><u>T</u>ools</span></div>
      <div class="menu-item"><span><u>E</u>xtensions</span></div>
      <div class="menu-item"><span><u>W</u>indow</span></div>
      <div class="menu-item"><span><u>H</u>elp</span></div>
    </nav>

    <!-- Top Primary Toolbar (New, Open, Save, Print, etc.) -->
    <div class="pt-toolbar-primary">
      <button class="t-btn" id="tb-new" title="New (Ctrl+N)">
        <img src="assets/toolbar/file.svg" alt="New">
      </button>
      <button class="t-btn" id="tb-open" title="Open (Ctrl+O)">
        <img src="assets/toolbar/folder.svg" alt="Open">
      </button>
      <button class="t-btn" id="tb-save" title="Save (Ctrl+S)">
        <img src="assets/toolbar/document.svg" alt="Save">
      </button>
      <button class="t-btn" id="tb-print" title="Print">
        <img src="assets/toolbar/print.svg" alt="Print">
      </button>
      <button class="t-btn" id="tb-activity" title="Activity Wizard">
        <img src="assets/toolbar/activity-wizard.svg" alt="Activity Wizard">
      </button>
      <div class="t-sep"></div>
      <button class="t-btn" id="tb-copy" title="Copy (Ctrl+C)">
        <img src="assets/toolbar/copy.svg" alt="Copy">
      </button>
      <button class="t-btn" id="tb-paste" title="Paste (Ctrl+V)">
        <img src="assets/toolbar/paste.svg" alt="Paste">
      </button>
      <button class="t-btn" id="tb-undo" title="Undo (Ctrl+Z)">
        <img src="assets/toolbar/undo.svg" alt="Undo">
      </button>
      <button class="t-btn" id="tb-redo" title="Redo (Ctrl+Y)">
        <img src="assets/toolbar/redo.svg" alt="Redo">
      </button>
      <div class="t-sep"></div>
      <button class="t-btn" id="tb-zoom-in" title="Zoom In">
        <img src="assets/toolbar/zoom-in.svg" alt="Zoom In">
      </button>
      <button class="t-btn" id="tb-zoom-reset" title="Zoom Reset">
        <img src="assets/toolbar/zoom-reset.svg" alt="Zoom Reset">
      </button>
      <button class="t-btn" id="tb-zoom-out" title="Zoom Out">
        <img src="assets/toolbar/zoom-out.svg" alt="Zoom Out">
      </button>
      <div class="t-sep"></div>

      <!-- Quick Preset Lab Button -->
      <button class="t-btn-lab" id="tb-load-lab" title="Cargar Red Completa Preconfigurada">
        <img src="assets/common/CiscoLogo4.png" alt="Cisco" height="13">
        <span>Cargar Red Cisco (Router 2911 + 2 Subredes)</span>
      </button>

      <div style="flex:1;"></div>
      <img src="assets/common/CiscoLogo4.png" alt="Cisco" height="18" style="opacity: 0.85; margin-right: 8px;">
    </div>

    <!-- Secondary Action Toolbar (Matches User Screenshot 1 Exactly) -->
    <div class="pt-toolbar-secondary">
      
      <!-- Group 1: Select, Inspect, Delete, Resize -->
      <button class="sec-tool-btn active" id="tool-select" title="Select (Esc)">
        <img src="assets/toolbar/select.svg" alt="Select">
      </button>
      <button class="sec-tool-btn" id="tool-inspect" title="Inspect (I)">
        <img src="assets/toolbar/inspect.svg" alt="Inspect">
      </button>
      <button class="sec-tool-btn" id="tool-delete" title="Delete (Del)">
        <img src="assets/toolbar/delete.svg" alt="Delete">
      </button>
      <button class="sec-tool-btn" id="tool-resize" title="Resize Shape">
        <img src="assets/toolbar/resize.svg" alt="Resize">
      </button>

      <div class="sec-sep"></div>

      <!-- Group 2: Note, Line, Rectangle, Ellipse, Polygon -->
      <button class="sec-tool-btn" id="tool-note" title="Place Note (N)">
        <img src="assets/toolbar/notes.svg" alt="Place Note">
      </button>
      <button class="sec-tool-btn" id="tool-draw-line" title="Draw Line">
        <img src="assets/toolbar/line.svg" alt="Line">
      </button>
      <button class="sec-tool-btn" id="tool-draw-rect" title="Draw Rectangle">
        <img src="assets/toolbar/rectangle.svg" alt="Rectangle">
      </button>
      <button class="sec-tool-btn" id="tool-draw-ellipse" title="Draw Ellipse">
        <img src="assets/toolbar/ellipse.svg" alt="Ellipse">
      </button>
      <button class="sec-tool-btn" id="tool-draw-polygon" title="Draw Freeform Polygon">
        <img src="assets/toolbar/polygon.svg" alt="Polygon">
      </button>

      <div class="sec-sep"></div>

      <!-- Group 3: Add Simple PDU, Add Complex PDU -->
      <button class="sec-tool-btn" id="tool-pdu-simple" title="Add Simple PDU (P)">
        <img src="assets/toolbar/add-simple-pdu.svg" alt="Add Simple PDU">
      </button>
      <button class="sec-tool-btn" id="tool-pdu-complex" title="Add Complex PDU (C)">
        <img src="assets/toolbar/add-complex-pdu.svg" alt="Add Complex PDU">
      </button>

      <div style="flex:1;"></div>
    </div>

    <!-- Navy Blue Workspace Bar (Matches User Screenshot 1 Exactly) -->
    <div class="pt-workspace-navy-bar">
      <!-- Logical Pill Button -->
      <button class="ws-pill-btn active" id="btn-view-logical">
        <svg viewBox="0 0 24 24" class="ws-pill-icon"><circle cx="5" cy="18" r="3.2"/><circle cx="19" cy="6" r="3.2"/><circle cx="8" cy="7" r="2.8"/><line x1="5" y1="18" x2="8" y2="7" stroke="#fff" stroke-width="2.2"/><line x1="8" y1="7" x2="19" y2="6" stroke="#fff" stroke-width="2.2"/></svg>
        <span>Logical</span>
      </button>

      <!-- Physical Pill Button -->
      <button class="ws-pill-btn" id="btn-view-physical">
        <svg viewBox="0 0 24 24" class="ws-pill-icon"><rect x="4" y="3" width="16" height="18" rx="1.5" fill="none" stroke="#fff" stroke-width="2"/><line x1="7" y1="7" x2="17" y2="7" stroke="#fff" stroke-width="1.8"/><line x1="7" y1="11" x2="17" y2="11" stroke="#fff" stroke-width="1.8"/><line x1="7" y1="15" x2="17" y2="15" stroke="#fff" stroke-width="1.8"/></svg>
        <span>Physical</span>
      </button>

      <!-- Real-time Mouse Coordinate Tracker -->
      <div class="ws-coords-display">
        <span id="coord-tracker">x: 0, y: 0</span>
      </div>

      <div style="flex:1;"></div>
      <div class="ws-cluster-info">Root Workplace</div>
    </div>

    <!-- Center Canvas Area -->
    <div class="pt-canvas-container" id="canvas-container">
      <svg id="network-svg">
        <defs>
          <filter id="packet-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- Drawn shapes layer -->
        <g id="svg-shapes-layer"></g>
        <!-- Cables layer -->
        <g id="svg-cables-layer"></g>
        <!-- Animated packets layer -->
        <g id="svg-packets-layer"></g>
      </svg>

      <!-- Canvas Device DOM Elements injected here -->
      <!-- Notes injected here -->
    </div>

    <!-- Bottom Horizontal Bar (Matches User Screenshot 2 Exactly) -->
    <div class="pt-bottom-horizontal-dock">
      
      <!-- Top Strip: Time / Reset / FFW & Realtime / Simulation Tabs -->
      <div class="dock-header-strip">
        <div class="dock-header-left">
          <span class="dock-time-label">Time: <span id="dock-timer-text">00:00:00</span></span>
          <button class="dock-sim-icon-btn" id="btn-sim-reset" title="Reset Simulation">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffffff"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          </button>
          <button class="dock-sim-icon-btn" id="btn-sim-ffw" title="Fast Forward">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffffff"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
        </div>

        <div class="dock-header-right">
          <button class="dock-mode-pill active" id="tab-realtime">
            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9" fill="none" stroke="#ffffff" stroke-width="2"/><polyline points="12,6 12,12 16,14" fill="none" stroke="#ffffff" stroke-width="2"/></svg>
            <span>Realtime</span>
          </button>
          <button class="dock-mode-pill" id="tab-simulation">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z" fill="#ffffff"/></svg>
            <span>Simulation</span>
          </button>
        </div>
      </div>

      <!-- Main Horizontal Body (3 Columns: Categories | Middle Tray | Right PDU List) -->
      <div class="dock-horizontal-body">

        <!-- Column 1: Category Selector Box (~185px) -->
        <div class="dock-col-categories">
          <!-- Top Row of 6 Category Icons -->
          <div class="cat-icons-row-top">
            <button class="cat-btn-square active" data-cat="network-devices" title="Network Devices">
              <img src="assets/components/group0_on.png" alt="Network Devices" id="cat-img-0">
            </button>
            <button class="cat-btn-square" data-cat="end-devices" title="End Devices">
              <img src="assets/components/group1.png" alt="End Devices" id="cat-img-1">
            </button>
            <button class="cat-btn-square" data-cat="components" title="Components">
              <img src="assets/components/group2.png" alt="Components" id="cat-img-2">
            </button>
            <button class="cat-btn-square" data-cat="connections" title="Connections">
              <img src="assets/components/group3.png" alt="Connections" id="cat-img-3">
            </button>
            <button class="cat-btn-square" data-cat="misc" title="Miscellaneous">
              <img src="assets/components/group4.png" alt="Misc" id="cat-img-4">
            </button>
            <button class="cat-btn-square" data-cat="multiuser" title="Multiuser">
              <img src="assets/components/group5.png" alt="Multiuser" id="cat-img-5">
            </button>
          </div>

          <!-- Middle Category Name Display Bar -->
          <div class="cat-name-bar">
            <span id="current-cat-name-label">Routers</span>
          </div>

          <!-- Bottom Row of Subcategory Icons -->
          <div class="cat-icons-row-bottom" id="cat-sub-row">
            <!-- Populated dynamically (Routers, Switches, Hubs, Wireless, Security, WAN) -->
          </div>
        </div>

        <!-- Column 2: Devices Palette Tray (Middle, Scrollable) -->
        <div class="dock-col-devices">
          <!-- Devices Horizontal Scrollable Strip -->
          <div class="devices-scroll-strip" id="devices-scroll-strip">
            <!-- Dynamically populated device circular buttons -->
          </div>

          <!-- Centered Hover Status Label at bottom of tray -->
          <div class="device-hover-status-bar">
            <span id="device-hover-label"></span>
          </div>
        </div>

        <!-- Collapse Toggle Arrow -->
        <div class="dock-tray-toggle" id="btn-toggle-tray" title="Collapse / Expand Tray">
          <span>&#9654;</span>
        </div>

        <!-- Column 3: PDU List & Scenario Manager (Right, flex: 1) -->
        <div class="dock-col-pdu">
          <!-- Left Scenario Controls -->
          <div class="pdu-controls-box">
            <div class="pdu-scenario-top">
              <button class="pdu-info-btn" title="Scenario Information">i</button>
              <select class="pdu-scenario-select" id="scenario-select">
                <option value="0">Scenario 0</option>
              </select>
            </div>
            <div class="pdu-btn-group">
              <button class="pdu-action-btn" id="btn-scenario-new">New</button>
              <button class="pdu-action-btn" id="btn-scenario-del">Delete</button>
            </div>
            <button class="pdu-toggle-btn" id="btn-toggle-pdu-win">Toggle PDU List Window</button>
          </div>

          <!-- Right PDU Table -->
          <div class="pdu-table-container">
            <table class="pdu-full-table">
              <thead>
                <tr>
                  <th style="width: 24px;">Fire</th>
                  <th>Last Status</th>
                  <th>Source</th>
                  <th>Destination</th>
                  <th>Type</th>
                  <th>Color</th>
                  <th>Time(sec)</th>
                  <th>Periodic</th>
                  <th>Num</th>
                  <th>Edit</th>
                  <th>Delete</th>
                </tr>
              </thead>
              <tbody id="pdu-full-table-body">
                <!-- User PDUs appear here -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- Port Picker Dialog -->
  <div id="port-picker" class="pt-port-picker" style="display: none;">
    <div class="port-picker-header">Puertos Disponibles:</div>
    <div class="port-picker-body" id="port-picker-list"></div>
  </div>

  <!-- Device Properties & CLI Modal -->
  <div id="pt-device-modal" class="pt-modal-overlay" style="display: none;">
    <div class="pt-modal-window">
      
      <!-- Modal Titlebar with Cisco Device Icon -->
      <div class="modal-win-titlebar">
        <div class="modal-win-title-left">
          <img src="assets/logical/iRouter@2x.png" id="modal-icon" alt="Device" class="modal-icon">
          <span id="modal-title">Router0 (2911)</span>
        </div>
        <div class="modal-win-controls">
          <button class="modal-ctrl-btn" id="modal-close">&times;</button>
        </div>
      </div>

      <!-- Tab Strip: Physical | Config | CLI | Desktop -->
      <div class="modal-tab-strip" id="modal-tabs">
        <!-- Injected dynamically -->
      </div>

      <!-- Tab Content Area -->
      <div class="modal-tab-view" id="modal-content">
        <!-- Content injected dynamically -->
      </div>

    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
